<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFO Studio — Pricing Configurator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #3D5A99;
    --blue-light: rgba(61,90,153,.08);
    --blue-mid: rgba(61,90,153,.15);
    --text: #1a1a1a;
    --text-2: #5a5a5a;
    --text-3: #9a9a9a;
    --border: rgba(0,0,0,.08);
    --border-2: rgba(0,0,0,.14);
    --surface: #ffffff;
    --surface-2: #f7f7f6;
    --surface-3: #f0f0ee;
    --radius: 10px;
    --radius-lg: 16px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--surface-2);
    color: var(--text);
    min-height: 100vh;
    padding: 48px 24px;
    line-height: 1.5;
  }

  .page {
    max-width: 860px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 40px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .logo-text { font-size: 17px; font-weight: 500; color: var(--text); letter-spacing: -.01em; }

  .header-note {
    font-size: 12px;
    color: var(--text-3);
    background: var(--surface-3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
  }

  h2 {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text-3);
    margin: 32px 0 12px;
  }

  h2:first-of-type { margin-top: 0; }

  .module-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 8px;
  }

  .mod-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    cursor: pointer;
    transition: border-color .12s, background .12s, transform .1s;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    user-select: none;
  }

  .mod-card:hover { border-color: var(--border-2); transform: translateY(-1px); }

  .mod-card.selected {
    border-color: var(--blue);
    border-width: 1.5px;
    background: var(--blue-light);
  }

  .check {
    width: 18px;
    height: 18px;
    min-width: 18px;
    border: 1px solid var(--border-2);
    border-radius: 4px;
    background: var(--surface-2);
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .12s, border-color .12s;
  }

  .mod-card.selected .check {
    background: var(--blue);
    border-color: var(--blue);
  }

  .check-icon { display: none; }
  .mod-card.selected .check-icon { display: block; }

  .mod-body { flex: 1; min-width: 0; }

  .mod-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 3px;
  }

  .mod-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 500;
    padding: 1px 6px;
    border-radius: 4px;
    margin-bottom: 5px;
    letter-spacing: .02em;
  }

  .badge-core    { background: rgba(61,90,153,.1);  color: #3D5A99; }
  .badge-intel   { background: rgba(15,110,86,.1);  color: #0F6E56; }
  .badge-strat   { background: rgba(83,74,183,.1);  color: #534AB7; }
  .badge-gtm     { background: rgba(186,117,23,.1); color: #9A6000; }

  .mod-price {
    font-size: 11px;
    color: var(--text-3);
    font-family: 'DM Mono', monospace;
  }

  .mod-price s { opacity: .45; }

  .addon-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .config-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }

  .config-label {
    font-size: 13px;
    color: var(--text-2);
    min-width: 130px;
  }

  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    background: var(--surface-3);
    border-radius: 2px;
    outline: none;
    border: 1px solid var(--border);
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    background: var(--blue);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(61,90,153,.3);
  }

  .config-val {
    font-size: 14px;
    font-weight: 500;
    font-family: 'DM Mono', monospace;
    color: var(--text);
    min-width: 28px;
    text-align: right;
  }

  .summary {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px 24px;
    margin-top: 32px;
  }

  .summary-header {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 16px;
  }

  .summary-line {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text-2);
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
  }

  .summary-line:last-of-type { border-bottom: none; }
  .summary-line span:last-child { color: var(--text); font-weight: 500; font-family: 'DM Mono', monospace; }

  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border-2);
  }

  .total-left { }
  .total-label { font-size: 15px; font-weight: 500; color: var(--text); }
  .setup-note { font-size: 12px; color: var(--text-3); margin-top: 3px; font-family: 'DM Mono', monospace; }

  .total-right { text-align: right; }
  .total-amount { font-size: 28px; font-weight: 300; color: var(--blue); font-family: 'DM Mono', monospace; letter-spacing: -.02em; }
  .total-period { font-size: 12px; color: var(--text-3); margin-top: 2px; }

  .empty { font-size: 13px; color: var(--text-3); padding: 8px 0; font-style: italic; }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 32px 0;
  }

  .bundle-notice {
    font-size: 12px;
    color: #0F6E56;
    background: rgba(15,110,86,.07);
    border: 1px solid rgba(15,110,86,.15);
    border-radius: 6px;
    padding: 8px 12px;
    margin-top: 10px;
    display: none;
  }

  .bundle-notice.visible { display: block; }

  @media (max-width: 520px) {
    .module-grid { grid-template-columns: 1fr; }
    .addon-grid { grid-template-columns: 1fr; }
    header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <div>
      <div class="logo-text">CFO Studio — Pricing configurator</div>
    </div>
    <div class="header-note">Internal use · incro</div>
  </header>

  <h2>Modules</h2>
  <div class="module-grid" id="module-grid"></div>
  <div class="bundle-notice" id="bundle-notice">Core bundle discount applied — AI Chat + P&L + Cashflow + Balance Sheet from $10,000 setup.</div>

  <div class="divider"></div>

  <h2>Add-ons</h2>
  <div class="addon-grid" id="addon-grid"></div>

  <div class="divider"></div>

  <h2>Configuration</h2>
  <div class="config-row">
    <span class="config-label">Number of users</span>
    <input type="range" min="1" max="50" value="5" step="1" id="users-slider">
    <span class="config-val" id="users-val">5</span>
  </div>
  <div class="config-row">
    <span class="config-label">Data sources</span>
    <input type="range" min="1" max="10" value="2" step="1" id="sources-slider">
    <span class="config-val" id="sources-val">2</span>
  </div>

  <div class="summary">
    <div class="summary-header">Estimate summary</div>
    <div id="summary-lines"></div>
    <div class="total-row">
      <div class="total-left">
        <div class="total-label">Monthly subscription</div>
        <div class="setup-note" id="setup-note"></div>
      </div>
      <div class="total-right">
        <div class="total-amount" id="monthly-total">$0</div>
        <div class="total-period" id="total-period">/month</div>
      </div>
    </div>

  </div>

</div>

<script>
const MODULES = [
  {id:'chat',          name:'CFO Studio AI chat',   tier:'core',  badge:'Core',          setup:4000, perUser:45},
  {id:'pl',            name:'P&L',                  tier:'core',  badge:'Core',          setup:2500, perUser:30},
  {id:'cashflow',      name:'Cashflow',              tier:'core',  badge:'Core',          setup:2000, perUser:28},
  {id:'bs',            name:'Balance sheet',         tier:'core',  badge:'Core',          setup:1500, perUser:25},
  {id:'pva',           name:'Plan vs actual',        tier:'intel', badge:'Intelligence',  setup:2500, perUser:35},
  {id:'kpi',           name:'KPI tracker',           tier:'intel', badge:'Intelligence',  setup:2000, perUser:30},
  {id:'reporting',     name:'Reporting',             tier:'intel', badge:'Intelligence',  setup:2500, perUser:30},
  {id:'forecast',      name:'Forecasting',           tier:'strat', badge:'Strategic',     setup:4000, perUser:50},
  {id:'budget',        name:'Planning & budgeting',  tier:'strat', badge:'Strategic',     setup:5000, perUser:60},
  {id:'consolidation', name:'Group consolidation',   tier:'strat', badge:'Strategic',     setup:6000, perUser:65},
  {id:'uniteco',       name:'Unit economics',        tier:'gtm',   badge:'GTM',           setup:3000, perUser:45},
  {id:'gtm',           name:'GTM dashboard',         tier:'gtm',   badge:'GTM',           setup:3000, perUser:45},
];

const ADDONS = [
  {id:'mcp',    name:'Claude MCP connector', setup:4000, perUser:20, flatMonthly:0},
  {id:'onprem', name:'On-prem installation', setup:8000, perUser:0,  flatMonthly:700},
];

const CORE_IDS = ['chat','pl','cashflow','bs'];
const CORE_BUNDLE_PRICE = 10000;

let selected = new Set(['chat','pl','cashflow','bs']);
let selectedAddons = new Set();
let users = 5;
let sources = 2;

function fmt(n){ return '$' + n.toLocaleString('en-US'); }

function checkSVG(){
  return `<svg class="check-icon" width="10" height="8" viewBox="0 0 10 8" fill="none">
    <path d="M1 4L3.5 6.5L9 1" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function hasAllCore(){ return CORE_IDS.every(id => selected.has(id)); }

function effectiveSetup(){
  const mods = MODULES.filter(m => selected.has(m.id));
  if(hasAllCore()){
    const nonCore = mods.filter(m => !CORE_IDS.includes(m.id));
    return CORE_BUNDLE_PRICE + nonCore.reduce((s,m) => s + m.setup, 0);
  }
  return mods.reduce((s,m) => s + m.setup, 0);
}

function renderModules(){
  const bundled = hasAllCore();
  document.getElementById('bundle-notice').classList.toggle('visible', bundled);
  document.getElementById('module-grid').innerHTML = MODULES.map(m => {
    const isCore = CORE_IDS.includes(m.id);
    let priceHTML;
    if(isCore && bundled){
      priceHTML = `<s>${fmt(m.setup)}</s> bundled · ${fmt(m.perUser)}/user/mo`;
    } else {
      priceHTML = `${fmt(m.setup)} setup · ${fmt(m.perUser)}/user/mo`;
    }
    return `<div class="mod-card${selected.has(m.id)?' selected':''}" onclick="toggle('${m.id}')">
      <div class="check">${checkSVG()}</div>
      <div class="mod-body">
        <div class="mod-name">${m.name}</div>
        <span class="mod-badge badge-${m.tier}">${m.badge}</span>
        <div class="mod-price">${priceHTML}</div>
      </div>
    </div>`;
  }).join('');
}

function renderAddons(){
  document.getElementById('addon-grid').innerHTML = ADDONS.map(a => {
    const parts = [];
    parts.push(`${fmt(a.setup)} setup`);
    if(a.perUser) parts.push(`${fmt(a.perUser)}/user/mo`);
    if(a.flatMonthly) parts.push(`${fmt(a.flatMonthly)}/mo infra`);
    return `<div class="mod-card addon-card${selectedAddons.has(a.id)?' selected':''}" onclick="toggleAddon('${a.id}')">
      <div class="check">${checkSVG()}</div>
      <div class="mod-body">
        <div class="mod-name">${a.name}</div>
        <div class="mod-price">${parts.join(' · ')}</div>
      </div>
    </div>`;
  }).join('');
}

function toggle(id){
  selected.has(id) ? selected.delete(id) : selected.add(id);
  renderModules(); calc();
}

function toggleAddon(id){
  selectedAddons.has(id) ? selectedAddons.delete(id) : selectedAddons.add(id);
  renderAddons(); calc();
}

function calc(){
  const mods = MODULES.filter(m => selected.has(m.id));
  const adds = ADDONS.filter(a => selectedAddons.has(a.id));

  const totalSetup = effectiveSetup() + adds.reduce((s,a) => s + a.setup, 0);
  const subMods = mods.reduce((s,m) => s + m.perUser * users, 0);
  const subAdds = adds.reduce((s,a) => s + a.perUser * users + a.flatMonthly, 0);
  const extraSources = Math.max(0, sources - 3) * 250;
  const totalMonthly = subMods + subAdds + extraSources;

  let html = '';
  if(mods.length === 0 && adds.length === 0){
    html = '<div class="empty">Select at least one module to see an estimate.</div>';
  } else {
    if(hasAllCore()){
      const coreMonthly = CORE_IDS.reduce((s,id) => {
        const m = MODULES.find(x => x.id === id);
        return s + (m ? m.perUser * users : 0);
      }, 0);
      html += `<div class="summary-line"><span>Core bundle (AI Chat + P&L + Cashflow + BS)</span><span>${fmt(coreMonthly)}/mo</span></div>`;
      mods.filter(m => !CORE_IDS.includes(m.id)).forEach(m => {
        html += `<div class="summary-line"><span>${m.name}</span><span>${fmt(m.perUser * users)}/mo</span></div>`;
      });
    } else {
      mods.forEach(m => {
        html += `<div class="summary-line"><span>${m.name}</span><span>${fmt(m.perUser * users)}/mo</span></div>`;
      });
    }
    adds.forEach(a => {
      const mo = a.perUser * users + a.flatMonthly;
      html += `<div class="summary-line"><span>${a.name}</span><span>${fmt(mo)}/mo</span></div>`;
    });
    if(extraSources > 0){
      html += `<div class="summary-line"><span>Extra data sources (${sources - 3})</span><span>${fmt(extraSources)}/mo</span></div>`;
    }
  }

  document.getElementById('summary-lines').innerHTML = html;
  document.getElementById('monthly-total').textContent = fmt(totalMonthly);
  document.getElementById('setup-note').textContent = totalSetup > 0 ? `One-time setup: ${fmt(totalSetup)}` : '';
  document.getElementById('total-period').textContent = `/month · ${users} user${users > 1 ? 's' : ''}`;

}

document.getElementById('users-slider').addEventListener('input', e => {
  users = parseInt(e.target.value);
  document.getElementById('users-val').textContent = users;
  calc();
});
document.getElementById('sources-slider').addEventListener('input', e => {
  sources = parseInt(e.target.value);
  document.getElementById('sources-val').textContent = sources;
  calc();
});

renderModules();
renderAddons();
calc();
</script>
</body>
</html>
